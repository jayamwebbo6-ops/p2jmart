<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    </noscript>
    <link rel="icon" type="image/webp" href="/logo1.webp" />
    <title>P2J Mart</title>
    <script>
      (function() {
        let backendUrl = '%VITE_BACKEND_URL%';
        if (backendUrl.startsWith('%VITE_') || !backendUrl) {
          backendUrl = 'http://localhost:5000/api';
        }
        window.__homeCmsPromise = fetch(backendUrl + '/home-cms')
          .then(res => res.json())
          .catch(err => {
            console.error('Error early fetching home CMS:', err);
            return null;
          });
        window.__productsPromise = fetch(backendUrl + '/products')
          .then(res => res.json())
          .catch(err => {
            console.error('Error early fetching products:', err);
            return null;
          });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
